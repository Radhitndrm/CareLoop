services:
  postgres:
    image: postgres:16-alpine
    container_name: careloop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: careloop
      POSTGRES_PASSWORD: careloop
      POSTGRES_DB: careloop
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U careloop -d careloop']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: careloop-redis
    restart: unless-stopped
    # Host port 6380, bukan 6379 default. 6379 dipakai container lain di mesin
    # pengembangan, dan `docker compose up` gagal seluruhnya kalau salah satu
    # service tidak bisa bind port. Port dalam container tetap 6379, jadi
    # REDIS_URL di .env harus menulis 6380.
    ports:
      - '6380:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
